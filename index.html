<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mission Syedi Ikram E Millat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Mission Syedi Ikram E Millat</h1>
        <p class="subtitle">Member Portal</p>


        <!-- Login Box -->
        <div class="login-box">

            <h2>Member Login</h2>

            <input 
                type="tel" 
                id="mobile"
                placeholder="Enter Mobile Number"
            >

            <input 
                type="password" 
                id="password"
                placeholder="Enter Password"
            >

            <button id="loginBtn">
                Login
            </button>

            <p id="message"></p>

        </div>


        <!-- Dashboard (will activate after login) -->
        <div id="dashboard" style="display:none;">

            <h2>Welcome</h2>

            <div class="card">
                <h3>Member Details</h3>
                <p id="memberName"></p>
                <p id="memberMobile"></p>
            </div>


            <div class="card">
                <h3>ID Card</h3>
                <p>Coming Soon</p>
            </div>


            <div class="card">
                <h3>Duties</h3>
                <p>Coming Soon</p>
            </div>


            <div class="card">
                <h3>Announcements</h3>
                <p>Coming Soon</p>
            </div>


            <div class="card">
                <h3>Contact</h3>
                <p>Coming Soon</p>
            </div>

        </div>


    </div>


    <!-- Supabase + Script -->
    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
