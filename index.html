<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MSIM Member Portal</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="login-page">

<div class="login-box">

<img src="logo.png" class="logo">

<h1>Mission Syedi Ikram E Millat</h1>

<p>Member Portal</p>

<input
type="tel"
id="mobile"
placeholder="Mobile Number"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button id="loginBtn">
Login
</button>

<p id="message"></p>

</div>

</div>

<div id="dashboard" style="display:none;">

<header>

<h2>MSIM Dashboard</h2>

<button onclick="logout()">
Logout
</button>

</header>

<nav>

<button onclick="showPage('profile')">
Profile
</button>

<button onclick="showPage('duties')">
Duties
</button>

<button onclick="showPage('announcements')">
Announcements
</button>

<button onclick="showPage('contacts')">
Contacts
</button>

</nav>

<main>

<section id="profilePage">

<h3>Member Profile</h3>

<p id="memberName"></p>

<p id="memberMobile"></p>

</section>

<section id="dutiesPage" style="display:none;">

<h3>My Duties</h3>

<p>Coming Soon...</p>

</section>

<section id="announcementsPage" style="display:none;">

<h3>Announcements</h3>

<p>Coming Soon...</p>

</section>

<section id="contactsPage" style="display:none;">

<h3>Contacts</h3>

<p>Coming Soon...</p>

</section>

</main>

</div>

<script src="config.js"></script>
<script src="script.js"></script>

</body>
</html>
