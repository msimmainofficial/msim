<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MSIM Member Portal</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<link rel="stylesheet"
href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

<div class="login-page">

<div class="login-box">

<img
src="20260716_202708.png"
class="logo"
alt="MSIM Logo">

<h1>Mission Syedi Ikram E Millat</h1>

<p>Member Portal</p>

<input
type="tel"
id="mobile"
placeholder="Mobile Number">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<p id="message"></p>

</div>

</div>

<div id="dashboard"
style="display:none;">

<header class="top-header">

<div class="header-left">

<img
src="20260716_202708.png"
class="header-logo">

<div>

<h1 class="header-title">

Mission Syedi Ikram E Millat

</h1>

<p class="header-subtitle">

Kurla West & East Mumbai
(9867310766)

</p>

</div>

</div>

<div
class="menu-btn"
onclick="toggleMenu()">

☰

</div>

</header>

<div
id="sideMenu"
class="side-menu">

<button
onclick="showPage('profile');
toggleMenu();">

👤 My Profile

</button>

<button
onclick="showPage('duties');
toggleMenu();">

📋 My Duties

</button>

<button
onclick="showPage('announcements');
toggleMenu();">

📢 Announcements

</button>

<button
onclick="showPage('contacts');
toggleMenu();">

📞 Contacts

</button>

<button
onclick="logout()">

🚪 Logout

</button>

</div>

<main>
  <section id="profilePage">

<h3>Member Profile</h3>

<img
id="memberPhoto"
class="profile-photo"
src=""
alt="Profile Photo">

<div class="profile-card">

<p id="memberName"></p>

<p id="memberMobile"></p>

<p id="memberMemberId"></p>

<p id="memberBranch"></p>

<p id="memberStatus"></p>

<p id="memberJoiningDate"></p>

<a
id="memberIdCard"
target="_blank">

🪪 View ID Card

</a>

</div>

</section>

<section
id="dutiesPage"
style="display:none;">

<h3>📋 My Duties</h3>

<p>
No Duties Available
</p>

</section>

<section
id="announcementsPage"
style="display:none;">

<h3>📢 Announcements</h3>

<p>
No Announcements
</p>

</section>

<section
id="contactsPage"
style="display:none;">

<h3>📞 Contacts</h3>

<p>
Mission Syedi Ikram E Millat

<br><br>

Kurla West & East Mumbai

<br><br>

📱 9867310766

</p>

</section>

</main>

</div>

<script src="config.js"></script>

<script src="script.js"></script>

</body>

</html>
